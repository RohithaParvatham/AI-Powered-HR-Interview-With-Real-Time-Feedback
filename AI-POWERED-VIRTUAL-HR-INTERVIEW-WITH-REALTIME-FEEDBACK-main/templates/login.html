<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f5f9; color: #182230; margin: 0; padding: 48px 20px; }
        .container { max-width: 400px; margin: auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 8px 28px #18223018; }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; margin: 16px 0 6px; }
        input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #c8d0dc; border-radius: 6px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #2357d8; color: white; border: 0; border-radius: 6px; cursor: pointer; }
        .message { padding: 10px; border-radius: 6px; }
        .error { color: #8d1620; background: #fff0f0; }
        .success { color: #155b31; background: #eaf8ef; }
        .link { text-align: center; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome back</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message {{ category }}" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        <form action="/login" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>
        <p class="link">New here? <a href="/register">Create an account</a></p>
    </div>
</body>
</html>
